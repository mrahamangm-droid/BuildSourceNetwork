name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: bmn, POSTGRES_PASSWORD: bmn_local_dev, POSTGRES_DB: bmn_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bmn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bmn:bmn_local_dev@localhost:5432/bmn_test
      TEST_DATABASE_URL: postgresql://bmn:bmn_local_dev@localhost:5432/bmn_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
